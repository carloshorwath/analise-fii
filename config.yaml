piso_liquidez_21d: 500000.0
cdi_anual_pct: 10.5
janelas_percentil:
  - 252
  - 504
  - 756
janela_dy_meses:
  - 12
  - 24
  - 36
thresholds:
  pvp_percentil_barato: 30
  dy_gap_percentil_caro: 70
  meses_consec_alerta: 3
  dias_staleness: 3
  significancia: 0.05
  piso_liquidez: 500000
  alavancagem_limite: 1.05
  dy_janela_pregoes: 252
  pvp_janela_pregoes: 504
  meses_saudaveis_min: 4
  cvm_defasagem_dias: 45
  cotas_crescimento_max: 0.01
  classificacao_imoveis_min: 0.60
  classificacao_recebiveis_min: 0.60

sinais:
  forward_days: 20
  score_buy_threshold: 2
  score_sell_threshold: -2
  tickers:
    KNIP11:
      buy:
        pvp_percentil_max: 30
        dy_gap_percentil_min: 70
        meses_alerta_max: 0
      sell:
        pvp_percentil_min: 70
        dist_maior_geracao: true
        meses_alerta_min: 2
    CPTS11:
      buy:
        pvp_percentil_max: 20
        dy_gap_percentil_min: 80
        meses_alerta_max: 0
      sell:
        pvp_percentil_min: 80
        dist_maior_geracao: true
    HSRE11:
      buy:
        pvp_max: 0.85
        pvp_percentil_max: 20
      sell:
        pvp_min: 1.05
    CPSH11:
      buy:
        pvp_percentil_max: 30
        dy_gap_percentil_min: 70
      sell:
        pvp_percentil_min: 70
    GARE11:
      buy:
        pvp_max: 0.90
      sell:
        pvp_min: 1.05
    SNEL11:
      buy:
        pvp_percentil_max: 30
      sell:
        pvp_percentil_min: 70

oportunidades:
  spread_pvp_percentil_min: 25
  persistencia_dias: 3
  cooldown_dias: 21
  max_oportunidades_dia: 3
  # Rotacao so quando o candidato tem score composto >= score da posicao vendida
  # (anti value-trap: barato e pior nao e troca, e downgrade)
  delta_score_min: 0


# Saude do fundo: limiares sobre a variacao PERCENTUAL do VP/cota por mes
# (slope da regressao / VP medio da janela * 100). Calibrados originalmente
# para cota ~R$100 (0,1 e -0,5 R$/mes) e convertidos para % do VP.
saude:
  vp_pct_mes_saudavel: 0.1      # acima disso: sem destruicao (score 0)
  vp_pct_mes_severo: -0.5       # abaixo disso: destruicao severa (score 100)
  tendencia_delta_pct_mes: 0.1  # diferenca slope 3m vs 6m (p.p./mes) p/ melhorando/piorando

# Voto dos sinais (recommender): sinal so conta se tiver suporte estatistico.
decisao:
  suporte_n_min: 30             # n minimo de eventos independentes fora da amostra
  fdr_q: 0.05                   # FDR (Benjamini-Hochberg) sobre a familia = sinais BUY/SELL ativos da rodada
  preco_defasado_dias_uteis: 5  # atraso (pregoes) do ultimo preco vs data de referencia
